name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  schedule:
    # Weekly, so test-latest catches new FastAPI releases even without commits.
    - cron: "0 6 * * 1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run ty check

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync
      - run: uv run pytest --cov
      # Report coverage from a single matrix leg (identical 100% across versions); never from test-floor.
      - name: Generate lcov report
        if: matrix.python-version == '3.12'
        run: uv run coverage lcov -o coverage.lcov
      - name: Upload coverage to Coveralls
        if: matrix.python-version == '3.12'
        uses: coverallsapp/github-action@v2
        with:
          file: coverage.lcov

  test-floor:
    # Lowest supported direct dependencies (FastAPI 0.115, pydantic 2.9): eager routing regime.
    # No coverage gate — the iter_route_contexts branch cannot run without that attribute.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --resolution lowest-direct
      - run: uv run --no-sync pytest

  test-latest:
    # Newest FastAPI/Starlette/pydantic, regardless of the lockfile: Dependabot deliberately
    # leaves runtime dependencies alone, so this is what surfaces upstream breakage.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: "3.14"
      - run: >-
          uv sync
          --upgrade-package fastapi
          --upgrade-package starlette
          --upgrade-package pydantic
          --upgrade-package pydantic-core
      - run: uv run --no-sync pytest --cov
